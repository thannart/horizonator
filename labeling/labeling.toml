# Configuration of the peak labeling tools (label-peaks.py, labeling/).
# Every tunable value lives here; the code has no magic numbers.

[paths]
# JSON list from: ./query-peaks-from-osm.py --json LAT LON RADIUS
peaks_json      = "~/.horizonator/peaks/lyon-peaks.json"
# Massif outlines: WGS84 lon/lat polygons
massifs_geojson = "~/Massifs-Panorama.geojson"
# Where the intermediate/debug outputs go (peaks_massifs.csv, ...)
output_dir      = "~/.horizonator/labeling"

[view]
# The viewpoint and the azimuth window being labeled. Only used, in this
# phase, to restrict the report to the peaks that matter for this view
lat       = 45.77294
lon       = 4.82993
az_min    = 80.0
az_max    = 160.0
zfar_m    = 190000.0

[peaks]
# Peaks with no name in OSM (only an altitude) are never labeled
require_name = true

# The render the labels are computed on (and later drawn over). Rendered in
# azimuth tiles through the Python bindings, and cached
[render]
SRTM1           = true
dir_landcover   = "~/.horizonator/landcover-srtm1"
# Angular resolution of the final image, the same horizontally and
# vertically (the renderer's projection)
px_per_deg      = 200.0
# Full image height, before any bottom cut; the horizon is its middle row
height_px       = 800
# Width of each render tile (the offscreen buffer); the panorama is split
# into equal tiles of at most this width
max_tile_px     = 4800
curvature       = true
refraction_k    = 0.13
viewer_height_m = 0.0
# Look (only matters for the image, not for the scores)
materials       = true
shading         = true
sun_azimuth     = 215.0
sun_elevation   = 47.5
znear_m         = 100.0

[score]
# Extra azimuth rendered on each side of the view, so the prominence
# search window of a peak near the edge is complete
margin_deg        = 3.0
# Peaks closer than this are not even scored
min_distance_m    = 500.0
# Peaks closer than this are scored (see peaks_scored.csv) but never
# labeled: foreground hills get a large angular prominence just by being
# near, and aren't what the panorama is about
min_label_distance_m = 75000.0
# Re-centering: the rendered summit is searched within this many degrees
# of the OSM position (OSM points can be off the DEM summit, and a named
# point can sit a little off the highest point of its ridge). It must be a
# true local maximum: a maximum on the edge of this window means the point
# is on the slope of something higher, not a summit (score 0)
recal_deg         = 0.1
# Terrain up to this far BEHIND the peak still counts in its profile S
delta_behind_m    = 4000.0
# Terrain at least this far IN FRONT of the peak forms its masking horizon
delta_front_m     = 1000.0
# A peak whose clearance (measured at the column of its rendered summit)
# is below -hidden_tol_deg is hidden (score 0); absorbs DEM/OSM elevation
# differences
hidden_tol_deg    = 0.01
# Several OSM points re-centered onto the same rendered summit (within
# this many degrees, both ways) are one peak: only the most notable one
# (sitelinks, then elevation) is kept
dedup_deg         = 0.01
# Prominence: search window on each side of the peak
prom_window_deg   = 3.0
# All the angular thresholds are in degrees, so the scores don't depend on
# the render's resolution. Below this angular prominence: score 0
prom_min_deg      = 0.024
# Normalization scales (degrees) and weights of the score
prom_full_deg     = 0.3
clear_full_deg    = 0.15
w_prominence      = 0.55
w_notoriety       = 0.30
w_clearance       = 0.15
# Optional atmospheric attenuation: score *= exp(-d / L)
attenuation       = false
attenuation_L_m   = 175000.0

[wikidata]
api           = "https://www.wikidata.org/w/api.php"
user_agent    = "horizonator label-peaks.py (peak labeling)"
batch_size    = 50
timeout_s     = 60
cache_json    = "wikidata_sitelinks.json"

[massifs]
# The massif name is in one of these GeoJSON properties, depending on the
# source of the polygon (regional parks / national parks and "MASSIF"
# zonings): the first non-empty one is used
name_fields = ["DRGP_L_LIB", "nom_site"]
# The massif given to a peak outside every polygon
outside_name = "Hors liste"
# A peak outside every polygon but at most this far from one is attributed
# to the nearest one: the "MASSIF" polygons are unions of communes, whose
# boundaries often follow the ridges, so summits land right on (or a few
# meters outside) the outline (e.g. Grande Tête de l'Obiou / Dévoluy)
snap_tolerance_km = 1.0

# Report of the peaks that fall outside every polygon although they are
# probably part of a massif whose polygon is only a national-park
# perimeter (narrower than the massif in common usage)
[massifs.narrow_perimeter_report]
# GeoJSON property and values identifying such perimeters
type_field  = "type_protection"
type_values = ["PNN"]
# Only peaks at least this high...
min_ele_m   = 2500.0
# ...and at most this far from such a perimeter
max_dist_km = 15.0
# Console report length (the full list goes to massif_suspects.csv)
max_lines   = 25

# What label-peaks.py prints to check its results against known peaks
[validation]
top_n = 40
# Maximum distance (px) between a label's leader line foot and its peak's
# own rendered terrain
alignment_tol_px = 3.0
peaks = ["Mont Blanc / Monte Bianco", "Grand Pic de la Meije", "Barre des Écrins",
         "Mont Aiguille", "Le Grand Som", "Chamechaude", "Dent de Crolles",
         "Grand Veymont", "Grande Tête de l'Obiou", "Le Taillefer"]

# Phase 3: depth planes and label rows
[plans]
# Number of depth planes the massifs are grouped into (cut at the largest
# gaps between the median distances of their labelable peaks)
count          = 4
# "near_low": the nearest plane gets the lowest band of rows (just above
# the skyline), the farthest the highest; "far_low": the reverse
band_order     = "near_low"
# Rows per band: a massif's labels share one row as much as possible; the
# others are used only on collisions
rows_per_band  = 2
# Vertical gap (px) between the highest rendered terrain of the view and
# the bottom of the lowest row
skyline_gap_px = 40
# Vertical distance (px) between the bottoms of two consecutive rows. The
# label text is vertical and grows UP from its row: this is set from the
# label lengths (see the phase 3 report)
row_spacing_px = 0
# If row_spacing_px is 0: this fraction of that percentile of the label
# lengths. Below 1, a label can reach up into the rows above it: phase 4
# checks collisions as 2D rectangles, not row by row
row_spacing_percentile = 90
row_spacing_factor     = 0.5

# Label text (phase 3 measures it; phase 5 draws it). Sizes in final
# image pixels
[labels]
font_family     = "DejaVu Sans"
name_size_px    = 22
alt_size_px     = 16
# Line advance, as a multiple of each line's font size
line_spacing    = 1.25
# Optional third line: 3-letter massif abbreviation
show_massif_abbrev = false
# Horizontal margin (px) added on each side of a label's footprint
margin_px       = 4

# Phase 4: which labels to show, and in which row
[selection]
# "pulp" (integer linear program, CBC) or "greedy" (also the fallback if
# PuLP isn't installed)
solver               = "pulp"
time_limit_s         = 120
# Each label is worth score^score_exponent in the objective: above 1, one
# major peak outweighs several minor neighbors (with 1, two 0.30 peaks beat
# a 0.42 one, e.g. the Meije)
score_exponent       = 2.0
# Relative objective bonus (x (1 + bonus)) for a label in its massif's main row
main_row_bonus       = 0.05
# Penalty for a visible massif left without any label (soft constraint)
massif_min_penalty   = 10.0
# No massif may have more than this fraction of all the labels
massif_cap_fraction  = 0.30
# Minimum horizontal/vertical gap (px) between two label boxes
box_gap_px           = 2
# A label's row must be at least this far (px) above its peak (room for
# the leader line)
min_leader_px        = 10

# Phase 5: drawing
[draw]
# Final image: the view window only (the scoring margins are cropped off),
# from the top of the canvas down to this far below the horizon
keep_below_horizon_deg = 0.25
# Extra sky (px) above the highest label
top_margin_px          = 20
# If the render doesn't have enough sky above the skyline for the label
# rows, it's re-rendered taller (the scores don't change: same px/deg)
auto_sky               = true
leader_width_px        = 1.2
# Vertical padding (px) inside a label box, at each end of the text
text_pad_px            = 4
# Massif name: once per massif, on a bar spanning its labels, just below
# the lowest row of its plane's band
massif_name_size_px    = 15
massif_bar_width_px    = 3
massif_bar_offset_px   = 6
# Colors: graph coloring (DSatur) of the massifs, two massifs being
# neighbors if their label spans are closer than this in azimuth (which
# includes massifs of different planes overlapping in azimuth)
adjacency_gap_deg      = 1.5
# Okabe-Ito palette (colorblind-safe), without black
palette = ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7"]
outside_color          = "#999999"
# Output files (in [paths] output_dir)
svg_name               = "labels_overlay.svg"
png_name               = "labels_composite.png"

# 3-letter massif abbreviations, for [labels] show_massif_abbrev
[massifs.abbrev]
"Vercors" = "VER"
"Queyras" = "QUE"
"Chartreuse" = "CHA"
"Massif Des Bauges" = "BAU"
"Mont Ventoux" = "VEN"
"Parc national des Ecrins" = "ECR"
"Parc national du Mercantour" = "MER"
"Parc national de la Vanoise" = "VAN"
"Préalpes de Digne" = "DIG"
"Parpaillon" = "PAR"
"Baronnies" = "BAR"
"Cerces" = "CER"
"Devoluy" = "DEV"
"Arves" = "ARV"
"Préalpes de Nice" = "NIC"
"Diois" = "DIO"
"Belledonne" = "BEL"
"Grandes Rousses" = "GRO"
"Taillefer" = "TAI"
"Beaufortain" = "BEA"
"Lauzière" = "LAU"
"Aravis" = "ARA"
"Chablais" = "CHB"
"Haute-Giffre" = "GIF"
"Bornes" = "BOR"
"Mont-Blanc" = "MBL"
"Hors liste" = "HL"

# label-peaks.py massif NAME: one massif alone, with as many of its peak
# names as possible, to choose which ones to show
[focus]
# Rows of labels (one band); the spacing follows [plans] row_spacing_*
rows             = 6
# Azimuth margin (deg) around the massif's labels in the cropped image
crop_margin_deg  = 1.0
# Box colors by status: what the normal selection would keep (by score),
# and what it leaves out
color_scored         = "#56B4E9"
color_low_prominence = "#F0E442"
color_not_summit     = "#CC79A7"
color_too_close      = "#E69F00"
png_name         = "massif_{slug}.png"
csv_name         = "massif_{slug}.csv"
